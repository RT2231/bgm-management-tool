name = "omacase-bgm"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# フロントエンドのオリジン（デプロイ後に実際のURLに変更してください）
ALLOWED_ORIGIN = "*"

# D1 データベースのバインディング
[[d1_databases]]
binding = "DB"
database_name = "omacase-bgm-db"
database_id = "fe720da1-a81c-45d9-baef-02d09314b9d4" # `wrangler d1 create omacase-bgm-db` で取得したIDに置き換えてください

# R2 バケットのバインディング
[[r2_buckets]]
binding = "BGM_BUCKET"
bucket_name = "omakase-streambgm"

# ローカル開発用の設定
[dev]
port = 8787
local_protocol = "http"
